name: Deploy legal pages to GitHub Pages

# GitHub Pages serves ONLY the privacy policy and support pages the App Store
# listing links to — never the web app itself, which would give the app away
# for free next to its App Store version.

on:
  push:
    branches: [main]
    paths:
      - public/privacy.html
      - public/support.html
      - public/favicon-32.png
      - public/apple-touch-icon.png
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the legal pages
        run: |
          mkdir site
          cp public/privacy.html public/support.html public/favicon-32.png public/apple-touch-icon.png site/
          printf '<!doctype html><meta charset="utf-8"><link rel="icon" type="image/png" href="./favicon-32.png"><meta http-equiv="refresh" content="0; url=./support.html"><title>Support</title><a href="./support.html">Support</a>\n' > site/index.html

      # force_orphan: the gh-pages branch keeps only these files, with none of
      # the web app builds it used to hold.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
